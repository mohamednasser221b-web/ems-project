name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
env:
  AWS_REGION: us-east-1
  # ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
permissions:
  contents: read
  id-token: write
  pull-requests: write
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-unit-tests:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
        cache: maven
    - name: Run tests
      working-directory: ./backend
      run: mvn clean test

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: backend/target/surefire-reports
    - name: Upload JaCoCo coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: backend/target/site/jacoco

  unit-tests-frontend:
    name: 🧪 Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "21"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: Run tests
      working-directory: frontend
      run: npm run test -- --run --coverage

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage
        path: frontend/coverage
  sonar-qube-gate:
    runs-on: ubuntu-latest
    needs:
    - backend-unit-tests
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
        cache: maven
    - name: Cache SonarQube dependencies
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar-${{ hashFiles('**/sonar-project.properties') }}

    - name: Build and analyze with SonarQube
      working-directory: ./backend
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn clean verify sonar:sonar \
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
          -Dsonar.organization=mohamednasser221b-web \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.token=${SONAR_TOKEN}
  snyk-scan:
  # Parallel scan with SonarQube
   runs-on: ubuntu-latest
   needs:
     - backend-unit-tests
   steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
        cache: maven

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "21"

    - name: Install Snyk
      run: npm install -g snyk

    - name: Run Snyk scan
      working-directory: ./backend
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      
      run: snyk test --all-projects --severity-threshold=high  
      continue-on-error: true     
  Docker_stage:
    runs-on: ubuntu-latest
    needs: sonar-qube-gate
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Debug GitHub context
      run: |
            echo "Repository: ${{ github.repository }}"
            echo "Ref: ${{ github.ref }}"
            echo "Event: ${{ github.event_name }}"
            echo "Actor: ${{ github.actor }}"

    - name: Get OIDC token
      id: oidc
      uses: actions/github-script@v7
      with:
           script: |
                     const token = await core.getIDToken("sts.amazonaws.com");
                     core.setSecret(token);
                     console.log(token);   
    - name: Decode OIDC claims
      uses: actions/github-script@v7
      with:
           script: |
                     const token = await core.getIDToken("sts.amazonaws.com");
                     const payload = JSON.parse(
                     Buffer.from(token.split('.')[1], 'base64').toString()
                                                                        );
                     console.log(JSON.stringify(payload, null, 2));                   
    - name: Configure AWS credentials 🔑
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Login to Amazon ECR
      id: ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        file: ./backend/Dockerfile
        load: true
        push: false
        tags: backend:${{ github.sha }}

    - name: Trivy Scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: backend:${{ github.sha }}
        format: table
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: os,library
        severity: CRITICAL,HIGH,MEDIUM

    - name: upload image to ECR
      if : always()
      run: |
        docker tag backend:${{ github.sha }} ${{ steps.ecr.outputs.registry }}/moriarty:backend-${{ github.sha }}
        docker tag backend:${{ github.sha }} ${{ steps.ecr.outputs.registry }}/moriarty:backend-latest
        docker push ${{ steps.ecr.outputs.registry }}/moriarty:backend-${{ github.sha }}
        docker push ${{ steps.ecr.outputs.registry }}/moriarty:backend-latest
